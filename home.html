<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Oprah's Birthday</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pristina&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Countdown to Oprah's Birthday</h1>
        <div class="countdown">
            <div class="time-unit">
                <span id="days">0</span>
                <br>Days
            </div>
            <div class="time-unit">
                <span id="hours">0</span>
                <br>Hours
            </div>
            <div class="time-unit">
                <span id="minutes">0</span>
                <br>Minutes
            </div>
            <div class="time-unit">
                <span id="seconds">0</span>
                <br>Seconds
            </div>
        </div>
        <a id="poetry-link" href="poetry1.html" class="poetry-link">View Today's Poetry</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
